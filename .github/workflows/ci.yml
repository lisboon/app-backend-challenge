name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:e2e

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run infra:test:up
      - run: bun run test:integration
      - run: docker compose up -d --wait --build
      - run: curl -fsS http://127.0.0.1:3000/health/ready
      - run: curl -fsS http://127.0.0.1:3001/metrics
      - if: always()
        run: docker compose --profile test down -v
